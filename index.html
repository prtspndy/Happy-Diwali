<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#170719">
    <meta name="description" content="A little light, a lot of love. Send warm wishes for joy, prosperity, and beautiful new beginnings this Diwali.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Happy Diwali — Pritesh Pandya">
    <meta property="og:description" content="May every diya light up your path with joy, prosperity, and beautiful new beginnings.">
    <meta name="twitter:card" content="summary">
    <title>Happy Diwali — Pritesh Pandya</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600;700&family=Sacramento&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600;700&family=Sacramento&display=swap">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="page">
      <canvas id="fireworks" aria-hidden="true"></canvas>
      <div class="stars" aria-hidden="true"></div>
      <div class="top-rule" aria-hidden="true"></div>
      <div class="lantern-row" aria-hidden="true">
        <i class="lantern"></i><i class="lantern"></i><i class="lantern"></i><i class="lantern"></i>
      </div>
      <main>
        <section class="greeting" aria-labelledby="greeting-title">
          <p class="eyebrow">A little light, a lot of love</p>
          <h1 id="greeting-title"><span class="happy">Happy</span><span class="diwali">Diwali</span></h1>
          <p class="message">May every <em>diya</em> light up your path with joy, prosperity, and beautiful new beginnings.</p>
          <div class="divider" aria-hidden="true">
            <svg viewBox="0 0 64 64" fill="none"><path d="M32 7C24 18 23 25 32 34c9-9 8-16 0-27Z" fill="currentColor"/><path d="M32 33c-17 0-25 5-25 10 0 8 13 14 25 14s25-6 25-14c0-5-8-10-25-10Z" fill="currentColor" opacity=".75"/><path d="M17 41h30" stroke="#3b112d" stroke-width="3" stroke-linecap="round"/></svg>
          </div>
          <p class="from">With warm wishes <span class="signature">Pritesh Pandya</span></p>
          <div class="diya-scene" aria-hidden="true"><div class="diya small"></div><div class="diya"></div><div class="diya small"></div></div>
        </section>
      </main>
      <div class="rangoli" aria-hidden="true"></div>
      <button class="replay" type="button" aria-label="Replay fireworks" title="Replay fireworks">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
      </button>
    </div>
  </body>
</html>
